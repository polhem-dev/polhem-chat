name: Build CI

# No trigger carries `paths` or `paths-ignore`: `build` is a required check, and a required check that never starts
# leaves a pull request (or a merge group) waiting forever. A documentation-only pull request is recognized inside the
# job instead, by .github/scripts/detect-docs-only.sh, which ends the job successfully without building.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test or restore ends the run instead of holding the runner for the default six hours.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect documentation-only pull request
        id: changes
        run: bash .github/scripts/detect-docs-only.sh

      - name: Setup .NET
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: dotnet build Polhem.Chat.slnx --configuration Release

      - name: Test
        if: steps.changes.outputs.build == 'true'
        run: dotnet test Polhem.Chat.slnx --configuration Release --no-build

      # The Blazor view's script is tested with Node's own test runner; no package is installed.
      - name: Setup Node.js
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      - name: Test scripts
        if: steps.changes.outputs.build == 'true'
        run: node --test tests/Polhem.Chat.Blazor.ScriptTests/polhem-chat.test.mjs

  # SonarCloud analysis. It runs apart from the build job above, because the scanner wraps the build and turns warnings
  # back into warnings, so the build job stays the gate for TreatWarningsAsErrors. Settings tied to the files of this
  # repository are in SonarQube.Analysis.xml.
  #
  # The job fails when the SonarCloud quality gate fails, and repo-baseline.json in polhem-dev/.github makes it a
  # required check of `main`. The check that SonarCloud posts itself is not required instead, because it never appears
  # on a run that skips the analysis; this job always starts and reports success there.
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # SonarCloud reads the history to find new code and to assign issues to authors.
          fetch-depth: 0

      - name: Detect documentation-only pull request
        id: changes
        run: bash .github/scripts/detect-docs-only.sh

      # The analysis is skipped instead of failing the run in these cases, and every later step, which is gated on
      # `enabled`, is skipped with it:
      # - a documentation-only pull request;
      # - a merge group: its branch has a new temporary name every time, which SonarCloud would record as a branch of
      #   its own, and the pull request was analysed already;
      # - no token: secrets are not passed to pull requests from forks, and the repository may not have one yet.
      - name: Check for the SonarCloud token
        id: token
        if: steps.changes.outputs.build == 'true' && github.event_name != 'merge_group'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "SONAR_TOKEN is not available, so the SonarCloud analysis is skipped."; fi

      - name: Setup .NET
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (for SonarScanner)
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache SonarCloud packages
        if: steps.token.outputs.enabled == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        if: steps.token.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarScanner begin
        if: steps.token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:"polhem-dev_polhem-chat"
          /o:"polhem-dev"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.qualitygate.wait=true
          /d:sonar.javascript.lcov.reportPaths="$GITHUB_WORKSPACE/TestResults/js/lcov.info"
          /s:"$GITHUB_WORKSPACE/SonarQube.Analysis.xml"

      - name: Build
        if: steps.token.outputs.enabled == 'true'
        run: dotnet build Polhem.Chat.slnx --configuration Release --no-incremental

      - name: Test with coverage
        if: steps.token.outputs.enabled == 'true'
        run: dotnet test Polhem.Chat.slnx --configuration Release --no-build --collect "Code Coverage;Format=xml" --results-directory TestResults/sonar

      - name: Setup Node.js
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      # The coverage of the Blazor view's script, as LCOV, which "SonarScanner begin" points the scanner to.
      # NOTE: The scanner reads the report for the project the script belongs to, src/Polhem.Chat.Blazor, and resolves
      # relative paths against that project's folder; the report's path and the paths of the files in it are therefore
      # absolute.
      - name: Test scripts with coverage
        if: steps.token.outputs.enabled == 'true'
        run: |
          mkdir -p TestResults/js
          node --test --experimental-test-coverage --test-coverage-include='src/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=TestResults/js/lcov.info \
            tests/Polhem.Chat.Blazor.ScriptTests/polhem-chat.test.mjs
          sed -i "s|^SF:|SF:$GITHUB_WORKSPACE/|" TestResults/js/lcov.info

      - name: SonarScanner end
        if: steps.token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
